# CI server API: jalankan test setiap ada perubahan di folder server/.
# Hasil hijau di branch main = boleh di-deploy (server/deploy/deploy.sh di CT mengecek ini).
name: Server

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Simpan laporan test kalau gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-test-server
          path: server/build/reports/tests/

      # Pastikan Dockerfile tetap bisa di-build (yang dipakai di CT).
      - name: Build image Docker
        run: docker build -t sempat-server:ci .
