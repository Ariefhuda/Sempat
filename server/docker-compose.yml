# Jalankan: docker compose up -d --build
# Dengan Cloudflare Tunnel: docker compose --profile tunnel up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sempat
      MYSQL_USER: sempat
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 (bukan localhost) supaya lewat TCP: saat MySQL baru pertama inisialisasi,
      # server sementara cuma buka socket, jadi cek ini baru lolos setelah MySQL benar-benar siap.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u sempat -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      retries: 20
    # Sengaja tidak ada "ports": database tidak bisa diakses dari luar container.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/sempat
      DB_USER: sempat
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NIK_SECRET: ${NIK_SECRET}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
    ports:
      # Untuk tes dari HP/laptop di jaringan yang sama: http://IP-container:8080
      - "8080:8080"

  # Lihat & ubah isi database lewat browser. Login pakai user "sempat" + DB_PASSWORD.
  # Dari internet: https://db-sempat.ususbuntu.my.id (lewat tunnel + Cloudflare Access).
  # Dari CT sendiri / SSH tunnel: http://localhost:8081
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: ${PMA_URL:-https://db-sempat.ususbuntu.my.id/}
      UPLOAD_LIMIT: 64M
    ports:
      # Hanya localhost: tidak bisa dibuka dari jaringan lain kecuali lewat tunnel.
      - "127.0.0.1:8081:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - api
      - phpmyadmin
    # Hostname -> service diatur di cloudflared/config.yml (api + phpMyAdmin).
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  db-data:
